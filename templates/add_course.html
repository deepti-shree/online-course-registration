{% extends "base.html" %}
{% block title %}Add Course{% endblock %}
{% block content %}
<div class="form-card wide"><p class="eyebrow">COURSE MANAGEMENT</p><h1>Add a course</h1>
<form method="POST" class="form-grid">
<label>Course code<input name="course_code" required></label><label>Course name<input name="course_name" required></label>
<label>Instructor<input name="instructor" required></label><label>Credits<input type="number" name="credits" min="1" max="24" required></label>
<label>Total seats<input type="number" name="total_seats" min="0" required></label><label class="span-two">Description<textarea name="description" rows="3"></textarea></label>
<div class="span-two"><button class="button">Save Course</button> <a class="button secondary" href="{{ url_for('admin.courses') }}">Cancel</a></div>
</form></div>
{% endblock %}
