{% extends "base.html" %}
{% block title %}Student Registration{% endblock %}
{% block content %}
<div class="form-card">
  <p class="eyebrow">GET STARTED</p><h1>Create student account</h1>
  <form method="POST" class="validate-form">
    <label>Full name<input name="name" required maxlength="100"></label>
    <label>Email address<input type="email" name="email" required></label>
    <label>Phone number<input name="phone" required maxlength="20"></label>
    <label>Branch / Department<input name="branch" required maxlength="80"></label>
    <label>Password<input type="password" name="password" minlength="8" required></label>
    <button class="button full" type="submit">Create Account</button>
  </form>
  <p class="muted center">Already registered? <a href="{{ url_for('auth.login') }}">Log in</a></p>
</div>
{% endblock %}
